name: Temporary cleanup of obsolete OPERA caches
on:
  push:
    paths:
      - '.github/workflows/temporary-prune-opera-state-caches.yml'
permissions:
  contents: read
  actions: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Remove obsolete OPERA state cache versions, keep newest and Crowther
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed
          repo=os.environ["GITHUB_REPOSITORY"]
          apiroot="https://api.github.com/repos/"+repo+"/actions"
          head={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def request(url,method="GET"):
            for attempt in range(6):
              req=urllib.request.Request(url,headers=head,method=method)
              try:
                with urllib.request.urlopen(req,timeout=45) as resp:
                  return json.load(resp) if method=="GET" else resp.status
              except urllib.error.HTTPError as e:
                if e.code in (403,429,500,502,503,504) and attempt<5:
                  time.sleep(min(24,2**attempt))
                  continue
                raise
          allc=[]
          for page in range(1,30):
            result=request(apiroot+f"/caches?per_page=100&page={page}")
            batch=result.get("actions_caches",[])
            allc.extend(batch)
            if len(batch)<100: break
          states=[c for c in allc if str(c.get("key","")).startswith("opera-state-")]
          crowther=[c for c in allc if str(c.get("key","")).startswith("crowther")]
          other=[c for c in allc if c not in states and c not in crowther]
          if not states:
            print("NO_OPERA_STATES",flush=True)
            raise SystemExit(0)
          states.sort(key=lambda c:(c.get("created_at",""),c.get("last_accessed_at","")),reverse=True)
          keep=states[0]
          doomed=states[1:]
          print("BEFORE",len(allc),sum(c.get("size_in_bytes",0) for c in allc),flush=True)
          print("KEEP_OPERA_STATE",json.dumps({"id":keep["id"],"key":keep["key"],"created_at":keep.get("created_at"),"last_accessed_at":keep.get("last_accessed_at"),"bytes":keep.get("size_in_bytes")}),flush=True)
          print("PRESERVE_CROWTHER",len(crowther),sum(c.get("size_in_bytes",0) for c in crowther),flush=True)
          print("PRESERVE_OTHER",len(other),flush=True)
          print("DELETE_CANDIDATES",len(doomed),sum(c.get("size_in_bytes",0) for c in doomed),flush=True)
          def erase(c):
            try:
              ok=request(apiroot+"/caches/"+str(c["id"]),"DELETE")==204
              return c,ok,None
            except Exception as exc:
              return c,False,str(exc)
          deleted=[];errors=[]
          with ThreadPoolExecutor(max_workers=3) as pool:
            for future in as_completed([pool.submit(erase,c) for c in doomed]):
              c,ok,err=future.result()
              if ok: deleted.append(c)
              else: errors.append({"id":c["id"],"err":err})
          print("DELETED",len(deleted),sum(c.get("size_in_bytes",0) for c in deleted),flush=True)
          print("DELETE_ERRORS",json.dumps(errors[:15]),flush=True)
          remaining=[]
          for page in range(1,30):
            batch=request(apiroot+f"/caches?per_page=100&page={page}").get("actions_caches",[])
            remaining.extend(batch)
            if len(batch)<100:break
          print("AFTER",len(remaining),sum(c.get("size_in_bytes",0) for c in remaining),flush=True)
          print("CROWTHER_INTACT",all(any(x["id"]==c["id"] for x in remaining) for c in crowther),flush=True)
          print("LATEST_STATE_INTACT",any(c["id"]==keep["id"] for c in remaining),flush=True)
          if errors: raise SystemExit(1)
          if not any(c["id"]==keep["id"] for c in remaining):raise SystemExit(2)
          if not all(any(x["id"]==c["id"] for x in remaining) for c in crowther):raise SystemExit(3)
          PY
