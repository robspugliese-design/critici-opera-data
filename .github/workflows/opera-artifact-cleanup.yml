name: OPERA safe artifact cleanup
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['OPERA automatic public backend']
    types: [completed]
  push:
    paths:
      - '.github/workflows/opera-artifact-cleanup.yml'
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: opera-artifact-cleanup
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune intermediate artifacts immediately after OPERA finishes
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os, re, sys, time, urllib.error, urllib.request
          from datetime import timezone
          repo=os.environ['GITHUB_REPOSITORY']
          root='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def api(url, method='GET'):
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=40) as response:
                  return json.load(response) if method=='GET' else response.status
          artifacts=[]
          for page in range(1,101):
              rows=api(root+'/actions/artifacts?per_page=100&page='+str(page)).get('artifacts',[])
              artifacts.extend(rows)
              if len(rows)<100:break
          else:
              print('SAFETY_ABORT: more than 10000 artifacts; pagination incomplete')
              sys.exit(1)
          grouped=collections.defaultdict(list)
          for a in artifacts:
              if a.get('expired'):continue
              match=re.fullmatch(r'opera-(?:discovery|shard-[0-7])-(\d+)',a.get('name',''))
              run=a.get('workflow_run') or {}
              if not match or str(run.get('id'))!=match.group(1):continue
              grouped[int(run['id'])].append(a)
          # Run completion is checked through GitHub, never merely inferred from age.
          # Keep two latest successful bundles for comparison and two recent
          # failed/cancelled bundles for diagnostics. Anything still running is safe.
          successful=[]
          failed=[]
          for run_id in grouped:
              info=api(root+'/actions/runs/'+str(run_id))
              if (info.get('status')!='completed'
                  or info.get('name')!='OPERA automatic public backend'):
                  continue
              if info.get('conclusion')=='success':
                  successful.append(run_id)
              elif info.get('conclusion') in ('failure','cancelled','timed_out'):
                  failed.append(run_id)
          successful.sort(reverse=True)
          failed.sort(reverse=True)
          retained_success=set(successful[:2])
          retained_failed=set(failed[:2])
          now=datetime.datetime.now(timezone.utc)
          def age_hours(a):
              created=datetime.datetime.fromisoformat(a['created_at'].replace('Z','+00:00'))
              return (now-created).total_seconds()/3600
          candidates=(
              [a for run_id in successful if run_id not in retained_success
               for a in grouped[run_id]]
              +
              # Do not accumulate diagnostic artifacts from persistent failures.
              # Protect newest two failed runs and at least two hours of their data.
              [a for run_id in failed if run_id not in retained_failed
               for a in grouped[run_id] if age_hours(a)>=2]
          )
          total=sum(a['size_in_bytes'] for a in candidates)
          current_bytes=sum(a['size_in_bytes'] for a in artifacts if not a.get('expired'))
          print('AUDIT',repo,'active',sum(not x.get('expired') for x in artifacts),
                'active_MiB',round(current_bytes/1048576,2),
                'OPERA_RUNS',len(grouped),'successful',len(successful),
                'failed',len(failed),
                'retain_success',sorted(retained_success,reverse=True),
                'retain_failure',sorted(retained_failed,reverse=True),
                'safe_candidates',len(candidates),
                'potential_MiB',round(total/1048576,2))
          # Does not touch Git repository files, published feeds, scientific caches,
          # Goose Bridge, or artifacts associated with an unfinished OPERA run.
          errors=[]
          deleted=0
          freed=0
          for a in candidates:
              try:
                  status=api(root+'/actions/artifacts/'+str(a['id']),'DELETE')
                  if status==204:
                      deleted+=1
                      freed+=a['size_in_bytes']
                  else:errors.append((a['id'],str(status)))
              except Exception as exc:
                  errors.append((a['id'],str(exc)[:120]))
          print('DELETED',deleted,'FREED_MiB',round(freed/1048576,2),
                'ERRORS',len(errors))
          if errors:
              print('FIRST_ERRORS',errors[:12])
              sys.exit(1)
          PY
