name: OPERA safe artifact cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opera-artifact-cleanup.yml'
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: opera-artifact-cleanup
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only intermediate artifacts of completed successful OPERA runs
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os, re, sys, time, urllib.error, urllib.request
          from datetime import timezone
          repo=os.environ['GITHUB_REPOSITORY']
          root='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def api(url, method='GET'):
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=40) as response:
                  return json.load(response) if method=='GET' else response.status
          artifacts=[]
          for page in range(1,101):
              rows=api(root+'/actions/artifacts?per_page=100&page='+str(page)).get('artifacts',[])
              artifacts.extend(rows)
              if len(rows)<100:break
          else:
              print('SAFETY_ABORT: more than 10000 artifacts; pagination incomplete')
              sys.exit(1)
          grouped=collections.defaultdict(list)
          for a in artifacts:
              if a.get('expired'):continue
              match=re.fullmatch(r'opera-(?:discovery|shard-[0-7])-(\d+)',a.get('name',''))
              run=a.get('workflow_run') or {}
              if not match or str(run.get('id'))!=match.group(1):continue
              grouped[int(run['id'])].append(a)
          # Explicitly inspect the workflow run conclusion: only successful, fully
          # published runs are eligible. Failed, cancelled and active runs are kept.
          successful=[]
          for run_id in grouped:
              info=api(root+'/actions/runs/'+str(run_id))
              if (info.get('status')=='completed'
                  and info.get('conclusion')=='success'
                  and info.get('name')=='OPERA automatic public backend'):
                  successful.append(run_id)
          successful.sort(reverse=True)
          retained=set(successful[:3]) # three recent successful run bundles for diagnosis
          now=datetime.datetime.now(timezone.utc)
          def age_hours(a):
              created=datetime.datetime.fromisoformat(a['created_at'].replace('Z','+00:00'))
              return (now-created).total_seconds()/3600
          candidates=[a for run_id in successful if run_id not in retained
                      for a in grouped[run_id] if age_hours(a)>=1]
          total=sum(a['size_in_bytes'] for a in candidates)
          print('AUDIT',repo,'active',sum(not x.get('expired') for x in artifacts),
                'OPERA_RUNS',len(grouped),'successful',len(successful),
                'protected_latest',sorted(retained,reverse=True),
                'safe_candidates',len(candidates),
                'potential_MiB',round(total/1048576,2))
          # This automation deliberately never deletes repository files, caches,
          # Goldoni assets, failed runs or intermediate artifacts still in use.
          errors=[]
          deleted=0
          freed=0
          for a in candidates:
              try:
                  status=api(root+'/actions/artifacts/'+str(a['id']),'DELETE')
                  if status==204:
                      deleted+=1
                      freed+=a['size_in_bytes']
                  else:errors.append((a['id'],str(status)))
              except Exception as exc:
                  errors.append((a['id'],str(exc)[:120]))
          print('DELETED',deleted,'FREED_MiB',round(freed/1048576,2),
                'ERRORS',len(errors))
          if errors:
              print('FIRST_ERRORS',errors[:12])
              sys.exit(1)
          PY
