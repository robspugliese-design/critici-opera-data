name: Actions log retention safeguard
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-log-retention.yml'
  schedule:
    - cron: '21 5 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: actions-log-retention
  cancel-in-progress: false
jobs:
  prune-old-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Limit billable logs while preserving run records and generated files
        run: |
          python3 - <<'PY'
          import datetime,json,os,sys,urllib.error,urllib.request,time
          from datetime import timezone
          repo=os.environ['GITHUB_REPOSITORY']
          is_opera=repo.endswith('/critici-opera-data')
          root='https://api.github.com/repos/'+repo
          hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
               'Accept':'application/vnd.github+json',
               'X-GitHub-Api-Version':'2022-11-28'}
          def api(url,method='GET'):
              req=urllib.request.Request(url,headers=hdr,method=method)
              with urllib.request.urlopen(req,timeout=35) as resp:
                  return json.load(resp) if method=='GET' else resp.status
          runs=[]
          for page in range(1,41):
              page_runs=api(root+'/actions/runs?per_page=100&page='+str(page)).get('workflow_runs',[])
              runs.extend(page_runs)
              if len(page_runs)<100:break
          else:
              raise SystemExit('Pagination safety limit hit; no deletes')
          if is_opera:
              runs=[r for r in runs if r.get('name')=='OPERA automatic public backend']
          runs.sort(key=lambda r:r['id'],reverse=True)
          recent_success={r['id'] for r in [x for x in runs if x.get('status')=='completed' and x.get('conclusion')=='success'][:10]}
          recent_failed={r['id'] for r in [x for x in runs if x.get('status')=='completed' and x.get('conclusion')!='success'][:3]}
          now=datetime.datetime.now(timezone.utc)
          startup=os.environ.get('GITHUB_EVENT_NAME') in ('push','workflow_dispatch')
          success_age=24 if is_opera else 72
          failed_age=168 if is_opera else 336
          candidates=[]
          for r in runs:
              if r.get('status')!='completed':continue
              age=(now-datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))).total_seconds()/3600
              success=r.get('conclusion')=='success'
              if r['id'] in (recent_success if success else recent_failed):continue
              cutoff=success_age if success else failed_age
              if age<cutoff:continue
              # The initial push performs the historical backlog once.
              # Daily runs use a 72-hour moving window, avoiding repeated
              # requests for already-deleted old logs.
              if not startup and age>cutoff+72:continue
              candidates.append(r)
          print('LOG_RETENTION',repo,'event',os.environ.get('GITHUB_EVENT_NAME'),
                'checked_runs',len(runs),'candidates',len(candidates),
                'successful_cutoff_hours',success_age,'failed_cutoff_hours',failed_age)
          ok=0
          skipped=0
          errors=[]
          for r in candidates:
              try:
                  status=api(root+'/actions/runs/'+str(r['id'])+'/logs','DELETE')
                  if status==204:ok+=1
                  else:errors.append((r['id'],str(status)))
              except urllib.error.HTTPError as e:
                  if e.code==404:skipped+=1
                  else:errors.append((r['id'],str(e.code)))
              except Exception as e:
                  errors.append((r['id'],str(e)[:100]))
          print('LOG_RETENTION_RESULT',repo,'deleted',ok,'already_absent',skipped,
                'errors',len(errors),'first_errors',errors[:5])
          if errors:sys.exit(1)
          PY
